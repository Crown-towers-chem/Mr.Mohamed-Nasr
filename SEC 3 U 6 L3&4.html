// ===================== بناء الواجهة (ترتيب واحد) =====================
function buildAllSections() {
    const container = document.getElementById('mainContainer');

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function playBar(sectionId) {
        return `<div class="sec-play-bar">
            <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
            <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
            <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
        </div>`;
    }

    function makeStorySection(title, storyData) {
        return `<div class="story-card">
            <div style="font-weight:bold;color:var(--A);margin-bottom:12px;">${title}</div>
            ${storyData.map((s,i) => {
                const id = `secStory_${title.replace(/\s/g,'')}_${i}`;
                let enText = s.en;
                const wordHtml = makeWordSpans(enText);
                return `<div class="sentence" id="${id}" data-speak="${s.en}" onclick="playOne('${id}')">${wordHtml}</div>`;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    let html = '';

    // 1. Key Vocabulary
    html += `<div class="section-block" id="secKeyVocab">
        <div class="sec-title">💊 Key Vocabulary</div>
        <div class="sec-body">
            ${playBar('secKeyVocab')}
            <div class="info-box"><div class="info-title">Key Vocabulary</div><div class="vocab">${makePills(keyVocab, 'secKeyVocab')}</div></div>
        </div>
    </div>`;

    // 2. Vocabulary on Reading & Listening
    html += `<div class="section-block" id="secFullVocab">
        <div class="sec-title">📚 Vocabulary on Reading & Listening</div>
        <div class="sec-body">
            ${playBar('secFullVocab')}
            <div class="info-box"><div class="info-title">Vocabulary on Reading & Listening Texts</div><div class="vocab">${makePills(l1l2Vocab, 'secFullVocab')}</div></div>
        </div>
    </div>`;

    // 3. Phrases, Expressions & Idioms
    html += `<div class="section-block" id="secPhrases">
        <div class="sec-title">💬 Phrases, Expressions & Idioms</div>
        <div class="sec-body">
            ${playBar('secPhrases')}
            <div class="rules-grid">${phrasesData.map((e,i) => makeRuleItem('💡', 'secPhrases', i, e[0], e[1], e[0])).join('')}</div>
        </div>
    </div>`;

    // 4. Prepositions
    html += `<div class="section-block" id="secPrepositions">
        <div class="sec-title">🔗 Prepositions</div>
        <div class="sec-body">
            ${playBar('secPrepositions')}
            <div class="rules-grid">${prepositionsData.map((p,i) => makeRuleItem('🔗', 'secPrepositions', i, p[0], p[1], p[0])).join('')}</div>
        </div>
    </div>`;

    // 5. Derivatives
    html += `<div class="section-block" id="secDerivatives">
        <div class="sec-title">🔨 Derivatives</div>
        <div class="sec-body">
            ${playBar('secDerivatives')}
            <div class="rules-grid">${derivativesData.map((d,i) => {
                const formsStr = d.forms.join(" | ");
                const speakText = `${d.word} | ${formsStr}`;
                const displayText = `${d.word} → ${formsStr}`;
                return makeRuleItem('🔨', 'secDerivatives', i, speakText, d.ex, displayText);
            }).join('')}</div>
        </div>
    </div>`;

    // 6. Synonyms & Antonyms
    html += `<div class="section-block" id="secSynonyms">
        <div class="sec-title">⚖️ Words, Synonyms & Antonyms</div>
        <div class="sec-body">
            ${playBar('secSynonyms')}
            <div class="rules-grid">${synAntData.map((s,i) => {
                const speakText = cleanForSpeech(s.word) + " | " + s.syn + " | " + s.ant;
                return makeRuleItem('⚖️', 'secSynonyms', i, speakText, `${s.syn} | ${s.ant}`, s.word + " | " + s.syn + " | " + s.ant);
            }).join('')}</div>
        </div>
    </div>`;

    // 7. Reading Text
    html += `<div class="section-block" id="secRead">
        <div class="sec-title">📖 Reading Text</div>
        <div class="sec-body">
            ${playBar('secRead')}
            ${makeStorySection('The Science and Value of Friendship', readingText)}
        </div>
    </div>`;

    // 8. Listening Text
    html += `<div class="section-block" id="secListen">
        <div class="sec-title">🎧 Listening Text</div>
        <div class="sec-body">
            ${playBar('secListen')}
            ${makeStorySection('A Beautiful Day with Friends', listeningText)}
        </div>
    </div>`;

    // 9. Definitions
    html += `<div class="section-block" id="secDefs">
        <div class="sec-title">📝 Definitions</div>
        <div class="sec-body">
            ${playBar('secDefs')}
            <div class="rules-grid">${definitionsData.map((d,i) => {
                const speakText = cleanForSpeech(d.word) + " | " + d.def;
                return makeRuleItem('📖', 'secDefs', i, speakText, d.def, d.word);
            }).join('')}</div>
        </div>
    </div>`;

    container.innerHTML = html;
}

// ===================== نظام الصوت =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    populateVoiceSelect();
}
function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    const allVoices = voices;
    if (!allVoices.length) return;
    const normalizeLang = (lang) => lang.replace('_', '-');
    const isLangMatch = (voiceLang, targetPrefix) => normalizeLang(voiceLang) === targetPrefix || normalizeLang(voiceLang).startsWith(targetPrefix + '-');
    const usVoice = allVoices.find(v => isLangMatch(v.lang, 'en-US'));
    const gbVoice = allVoices.find(v => isLangMatch(v.lang, 'en-GB'));
    const options = [];
    if (usVoice) options.push({ label: '🇺🇸 American', uri: usVoice.voiceURI });
    if (gbVoice) options.push({ label: '🇬🇧 British', uri: gbVoice.voiceURI });
    if (!options.length) {
        note.textContent = '⚠️ No US/UK voice found.';
        const anyEn = allVoices.filter(v => v.lang.startsWith('en')).slice(0,2);
        anyEn.forEach(v => options.push({ label: v.name + ' ('+v.lang+')', uri: v.voiceURI }));
    } else {
        note.textContent = '';
    }
    const savedURI = localStorage.getItem('voiceURI');
    vs.innerHTML = options.map(o => `<option value="${o.uri}">${o.label}</option>`).join('');
    if (savedURI && options.some(o => o.uri === savedURI)) vs.value = savedURI;
}
document.getElementById('voiceSelect').addEventListener('change', function() {
    localStorage.setItem('voiceURI', this.value);
});

function getSelectedVoice() {
    const uri = localStorage.getItem('voiceURI');
    return voices.find(v => v.voiceURI === uri) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}
function showFab(show) { if (show) fabPause.classList.add('show'); else fabPause.classList.remove('show'); }
function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) fabPause.innerHTML = '⏸️';
    else if (window.speechSynthesis.paused) fabPause.innerHTML = '▶️';
    else fabPause.innerHTML = '⏯️';
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights(); showFab(false); return;
    }
    const item = window._q[window._qi];
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }
    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    if (voice) u.voice = voice;

    u.onstart = () => { showFab(true); updateFabIcon(); };
    u.onend = function() { window._qi++; playQueue(); };
    u.onerror = function(e) { console.warn('Speech error', e); window._qi++; playQueue(); };
    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => { const trimmed = p.trim(); if (trimmed) window._q.push({id: id, text: trimmed}); });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    if(!sec) return;
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause(); updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume(); updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() { pauseAll(); }

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
setTimeout(loadVoices, 300);
setTimeout(loadVoices, 1000);
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
