// ===================== دوال مساعدة =====================
function cleanForSpeech(text) {
    let result = text;
    result = result.replace(/\([^)]*\)/g, ' '); 
    result = result.replace(/[→]/g, ' ');      
    result = result.replace(/\s+/g, ' ').trim(); 
    return result;
}

function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

    ["accusations", "اتهامات"], ["charity", "إحسان / صدقة"], ["condemned", "مدان / محكوم عليه"], ["denunciation", "وشاية / اتهام"], ["despair", "يأس"], ["etched", "منقوش / محفور في الذاكرة"], ["fortress", "قلعة / حصن"], ["frail", "ضعيف / واهن"], ["loyalty", "ولاء"], ["mildew", "عفن / فطر"], ["obsession", "هوس"], ["pity", "يُشفق على"], ["pleading", "متوسل / مستعطف"], ["rejoiced", "ابتهجوا / فرحوا"], ["traitor", "خائن"], ["treacherous", "خائن / غادر"]

const ch3Story = [
    {en: "The night of Edmond Dantès's arrest remained etched in the memory of all who had gathered to celebrate his betrothal. The music had stopped, the laughter had died, and soldiers had led him away as though he were a criminal. The faces of his father and Mercédès, full of terror and disbelief, haunted him as he sat alone in his cold prison cell.", ar: "ظلت ليلة اعتقال إدموند دانتيس محفورة في ذاكرة كل من اجتمع للاحتفال بخطوبته. توقفت الموسيقى، ومات الضحك، وقاده الجنود بعيداً كما لو كان مجرماً. كانت وجوه والده ومرسيدس، المليئة بالرعب وعدم التصديق، تطارده بينما كان يجلس وحيداً في زنزانته الباردة."},
    {en: "**Shadows of Conspiracy**", ar: "**ظلال المؤامرة**"},
    {en: "Long before the soldiers had arrived, betrayal had already taken root. Danglars, the purser of the Pharaon, and the jealous fisherman who desired Mercédès, had finished their treacherous letter of denunciation. Together they accused Edmond of being a traitor, secretly plotting against the country. They had written with clever words, just enough truth to make the lie seem real. Edmond had indeed received a letter on the island of Elba, and he had promised his dying captain to deliver it. That innocent act of loyalty became twisted into proof of treason. When the soldiers entered the feast, Edmond had no idea of the invisible web already closing around him.", ar: "قبل وقت طويل من وصول الجنود، كانت الخيانة قد ترسخت بالفعل. دانغلار، أمين صندوق الفرعون، والصياد الغيور الذي رغب في مرسيدس، أنهيا رسالة الإدانة الخائنة. اتهموا معاً إدموند بأنه خائن، يتآمر سراً ضد البلاد. لقد كتبوا بكلمات ذكية، بقدر كافٍ من الحقيقة لجعل الكذبة تبدو حقيقية. لقد تلقى إدموند بالفعل رسالة في جزيرة إلبا، ووعد قبطانها المحتضر بتسليمها. تحول هذا الفعل البريء من الولاء إلى دليل على الخيانة. عندما دخل الجنود العيد، لم يكن لدى إدموند أي فكرة عن الشبكة غير المرئية التي كانت تطوقه بالفعل."},
    {en: "**The Interrogation**", ar: "**الاستجواب**"},
    {en: "In the office of Gérard de Villefort, deputy prosecutor of Marseille, Edmond tried to explain himself. His voice was steady at first, confident in his innocence. 'I am loyal to the king,' he said. 'I have never spoken with enemies. I am a sailor, monsieur, nothing more. I only carried out the final wish of my captain.'", ar: "في مكتب جيرارد دو فيلفور، نائب المدعي العام في مرسيليا، حاول إدموند شرح نفسه. كان صوته ثابتاً في البداية، واثقاً من براءته. 'أنا مخلص للملك،' قال. 'لم أتحدث أبداً مع الأعداء. أنا بحار يا سيدي، لا أكثر. لقد نفذت فقط الرغبة الأخيرة لقبطان سفينتي.'"},
    {en: "Villefort, however, was torn between duty and ambition. In his hand lay the very letter that condemned not only Edmond but also Villefort's own father. If the letter were revealed, his career would collapse, his future destroyed. 'You admit to carrying this letter?' Villefort pressed. 'Yes,' Edmond answered honestly, 'but I did not know what it contained. I swear it, monsieur.'", ar: "ومع ذلك، كان فيلفور ممزقاً بين الواجب والطموح. في يده كانت الرسالة ذاتها التي أدانت ليس فقط إدموند بل أيضاً والد فيلفور نفسه. إذا تم الكشف عن الرسالة، ستنهار مسيرته المهنية، وسيُدمر مستقبله. 'أنت تعترف بحمل هذه الرسالة؟' ضغط فيلفور. 'نعم،' أجاب إدموند بصدق، 'لكني لم أعرف ما تحتويه. أقسم لك يا سيدي.'"},
    {en: "Villefort burned the letter in secret, protecting himself, but condemned Edmond aloud. 'By your own confession, you carried a message from the enemy of the king. That is treason.' Edmond's heart froze. 'But I am innocent!' he cried. 'Perhaps,' Villefort replied coldly. 'But the law does not ask for innocence. It asks for proof. And the proof condemns you.'", ar: "أحرق فيلفور الرسالة سراً، لحماية نفسه، لكنه أدان إدموند بصوت عالٍ. 'باعترافك الخاص، لقد حملت رسالة من عدو الملك. هذه خيانة.' تجمد قلب إدموند. 'لكني بريء!' صرخ. 'ربما،' رد فيلفور ببرود. 'لكن القانون لا يطلب البراءة. إنه يطلب الدليل. والدليل يدينك.'"},
    {en: "**The Arrest Confirmed**", ar: "**تأكيد الاعتقال**"},
    {en: "Back in Marseille, word spread quickly that Edmond had been taken to the Château d'If. People whispered his name in markets and taverns. Some pitied him, but others shrugged, saying, 'Where there is smoke, there is fire.' Only those who truly loved him—his father, Mercédès, and Monsieur Morrel—refused to believe the accusations.", ar: "عودة إلى مرسيليا، انتشرت الكلمة بسرعة بأن إدموند قد أُخذ إلى شاتو دي إف. همس الناس باسمه في الأسواق والحانات. شعر بعضهم بالأسف عليه، لكن آخرين هزوا أكتافهم قائلين، 'حيثما يوجد دخان، توجد نار.' فقط أولئك الذين أحبوه حقاً - والده، ومرسيدس، والسيد موريل - رفضوا تصديق الاتهامات."},
    {en: "Mercédès, desperate, went to every official she could reach. 'Edmond is no traitor,' she pleaded. 'His only love is the sea.' But her words met closed doors and deaf ears. No one dared question the orders of the prosecutor. Morrel, Edmond's employer, went personally to the authorities, offering his word as a man of honor that Edmond was loyal. Yet even his respected voice carried no weight against the written denunciation.", ar: "مرسيدس، اليائسة، ذهبت إلى كل مسؤول يمكنها الوصول إليه. 'إدموند ليس خائناً،' توسلت. 'حبه الوحيد هو البحر.' لكن كلماتها واجهت أبواباً مغلقة وآذاناً صماء. لم يجرؤ أحد على استجواب أوامر المدعي العام. موريل، صاحب عمل إدموند، ذهب شخصياً إلى السلطات، مقدماً كلمته كرجل شرف بأن إدموند كان مخلصاً. ومع ذلك، لم يكن لصوته المحترم أي وزن ضد الإدانة المكتوبة."},
    {en: "**Enemies in the Shadows**", ar: "**الأعداء في الظلال**"},
    {en: "While the innocent fought for Edmond, his enemies quietly rejoiced. Danglars, relieved to see the young sailor removed from command, already dreamed of power within the company. 'With Dantès gone, I can shape the future of the Pharaon as I please,' he thought. Fernand, meanwhile, turned his eyes to Mercédès. He visited her often, pretending to be her comfort.", ar: "بينما كان الأبرياء يقاتلون من أجل إدموند، ابتهج أعداؤه بهدوء. دانغلار، الذي شعر بالارتياح لرؤية البحار الشاب يُعزل من القيادة، كان يحلم بالفعل بالسلطة داخل الشركة. 'مع رحيل دانتيس، يمكنني تشكيل مستقبل الفرعون كما يحلو لي،' فكر. في الوقت نفسه، وجه فيرناند نظره إلى مرسيدس. زارها كثيراً، متظاهراً بأنه عزاؤها."},
    {en: "'I know you suffer,' he told her softly. 'But Edmond is gone. They will not free him. You must not waste your youth in waiting.' But Mercédès shook her head, her eyes filled with fire. 'I belong to Edmond. Until the day he returns, I will not listen to another.' Her loyalty stabbed Fernand with pain, but also fed his anger. 'Then let him rot in the Château d'If!' he muttered to himself. 'One day you will have no choice but to turn to me.'", ar: "'أعلم أنك تعانين،' قال لها بهدوء. 'لكن إدموند رحل. لن يطلقوا سراحه. يجب ألا تضيعي شبابك في الانتظار.' لكن مرسيدس هزت رأسها، وعيناها مليئة بالحريق. 'أنا أنتمي إلى إدموند. حتى اليوم الذي يعود فيه، لن أستمع إلى أي شخص آخر.' طعن ولاؤها فيرناند بالألم، لكنه غذى غضبه أيضاً. 'إذن دعه يتعفن في شاتو دي إف!' تمتم في نفسه. 'يوماً ما لن يكون لديك خيار سوى اللجوء إليَّ.'"},
    {en: "**Life Behind Bars**", ar: "**الحياة خلف القضبان**"},
    {en: "In the Château d'If, Edmond experienced the slow death of hope. The prison was a fortress of stone, standing on a lonely island, its windows barred and its corridors damp with sea air. When Edmond first arrived, he begged for mercy. 'There is a mistake,' he cried to the jailer. 'I am innocent!' The jailer laughed cruelly. 'All here say the same, young man. Yet they remain.'", ar: "في شاتو دي إف، عانى إدموند من الموت البطيء للأمل. كان السجن حصناً من الحجر، يقف على جزيرة معزولة، ونوافذه مسدودة وممراته رطبة بهواء البحر. عندما وصل إدموند لأول مرة، توسل طلباً للرحمة. 'هناك خطأ،' صرخ للسجان. 'أنا بريء!' ضحك السجان بقسوة. 'كل من هنا يقول نفس الشيء يا فتى. ومع ذلك يظلون.'"},
    {en: "Edmond was dragged through a long corridor lit only by torches. The smell of salt and mildew clung to the air. Guards mocked him as they pushed him into a narrow cell with a straw bed, a broken jug for water, and walls damp with cold. 'This is your palace, captain,' one guard sneered. Edmond's heart sank. The word 'captain,' once a promise of honor, now sounded like an insult.", ar: "تم سحب إدموند عبر ممر طويل مضاء فقط بالمشاعل. التصقت رائحة الملح والعفن بالهواء. استهزأ به الحراس بينما دفعوه إلى زنزانة ضيقة بسرير من القش، وإبريق ماء مكسور، وجدران رطبة باردة. 'هذا قصرك أيها القبطان،' سخر أحد الحراس. غرق قلب إدموند. كلمة 'قبطان'، التي كانت ذات يوم وعداً بالشرف، بدت الآن وكأنها إهانة."},
    {en: "He collapsed on the straw, covering his face with his hands. In a single day he had lost his freedom, his father, his love, and his future. He cried out to the heavens, 'Why am I here? What crime have I committed?' But the stones gave no answer.", ar: "انهار على القش، مغطياً وجهه بيديه. في يوم واحد فقد حريته، ووالده، وحبه، ومستقبله. صرخ إلى السماء، 'لماذا أنا هنا؟ أي جريمة ارتكبت؟' لكن الحجارة لم تجب."},
    {en: "Days passed into weeks, weeks into months. Edmond's youthful energy drained away, replaced by despair. He counted the stones in his cell, traced patterns in the cracks of the wall, and listened endlessly to the sea pounding against the rocks outside. At times he shouted his innocence into the darkness, but no one listened. His only visitors were the guards who brought him bread and water.", ar: "مرت الأيام لتصبح أسابيع، والأسابيع لتصبح أشهر. استنزفت طاقة إدموند الشابة، وحل محلها اليأس. عد الحجارة في زنزانته، وتتبع الأنماط في شقوق الجدار، واستمع بلا نهاية إلى البحر وهو يدق على الصخور في الخارج. أحياناً كان يصرخ ببراءته في الظلام، لكن لم يستمع أحد. زواره الوحيدون كانوا الحراس الذين يجلبون له الخبز والماء."},
    {en: "**The Suffering of His Father**", ar: "**معاناة والده**"},
    {en: "Back in Marseille, Edmond's father grew weaker each day. Without his son's support, the old man fell into poverty and despair. He refused food, his only comfort the memory of Edmond's voice. Morrel, kind-hearted and loyal, tried to help him, but grief was stronger than charity. 'Your son is innocent,' Morrel told him. 'I swear to you, I will not abandon him.' The old man squeezed his hand weakly. 'Tell him ... tell my Edmond ... that I loved him.' Soon after, his frail heart gave out, and he died alone, whispering his son's name.", ar: "عودة إلى مرسيليا، كان والد إدموند يضعف كل يوم. بدون دعم ابنه، سقط الرجل العجوز في الفقر واليأس. رفض الطعام، وكان عزاؤه الوحيد هو ذكرى صوت إدموند. حاول موريل، الطيب القلب والمخلص، مساعدته، لكن الحزن كان أقوى من الصدقة. 'ابنك بريء،' قال له موريل. 'أقسم لك، لن أتخلى عنه.' ضغط الرجل العجوز على يده بضعف. 'أخبره ... أخبر إدموند ... أنني أحببته.' بعد فترة وجيزة، توقف قلبه الضعيف، ومات وحيداً، يهمس باسم ابنه."},
    {en: "**Mercédès's Despair**", ar: "**يأس مرسيدس**"},
    {en: "For Mercédès, each day without Edmond was torture. She waited at the shore, gazing at the island prison across the water, as if her eyes could pierce the walls and reach him. She prayed constantly for his return, refusing every suggestion that she should forget him. Her beauty and loyalty only increased Fernand's obsession. He promised himself that if Edmond never returned, Mercédès would one day be his, no matter the cost.", ar: "بالنسبة لمرسيدس، كان كل يوم بدون إدموند بمثابة تعذيب. انتظرت على الشاطئ، محدقة في سجن الجزيرة عبر الماء، وكأن عينيها يمكن أن تخترق الجدران وتصل إليه. صلت باستمرار من أجل عودته، رافضة كل اقتراح بأن تنساه. زاد جمالها وولاؤها من هوس فيرناند فقط. وعد نفسه أنه إذا لم يعد إدموند أبداً، فإن مرسيدس ستصبح له يوماً ما، مهما كان الثمن."},
    {en: "**Villefort's Ambition**", ar: "**طموح فيلفور**"},
    {en: "Meanwhile, Gérard de Villefort enjoyed the rewards of his betrayal. By sending Edmond to prison and destroying the letter, he had secured his position with the royalists. He was praised for his vigilance, promoted for his loyalty, and prepared for marriage into a powerful family. Yet sometimes, late at night, he dreamed of Edmond's face—honest, confused, and pleading.", ar: "في الوقت نفسه، استمتع جيرارد دو فيلفور بمكافآت خيانته. بإرسال إدموند إلى السجن وتدمير الرسالة، كان قد ضمن موقعه مع الملكيين. تم الإشادة ب يقظته، وترقيته لولائه، واستعداده للزواج في عائلة قوية. ومع ذلك، في بعض الأحيان، في وقت متأخر من الليل، كان يحلم بوجه إدموند - صادقاً، ومرتبكاً، ومتوسلاً."}
];

// ===================== بناء الواجهة (الفصل الثالث فقط) =====================
function buildAllSections() {
    const container = document.getElementById('mainContainer');

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function playBar(sectionId) {
        return `<div class="sec-play-bar">
            <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
            <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
            <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
        </div>`;
    }

    function makeStorySection(title, storyData) {
        return `<div class="story-card">
            <div style="font-weight:bold;color:var(--A);margin-bottom:12px;">${title}</div>
            ${storyData.map((s,i) => {
                const id = `secStory_${title.replace(/\s/g,'')}_${i}`;
                let enText = s.en;
                let isTitle = enText.startsWith('**');
                let displayHtml = '';
                let speakText = enText.replace(/\*\*/g, '');
                
                if(isTitle) {
                    displayHtml = `<h3 style="color:var(--A2);margin-top:16px;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px;">${enText.replace(/\*\*/g, '')}</h3>`;
                } else {
                    const wordHtml = makeWordSpans(enText);
                    displayHtml = `<span class="word">${wordHtml}</span>`;
                }
                
                return `<div class="sentence" id="${id}" data-speak="${cleanForSpeech(speakText)}" onclick="playOne('${id}')">${displayHtml}</div>`;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    let html = '';

    // 1. New Vocabulary
    html += `<div class="section-block" id="ch3Vocab">
        <div class="sec-title">💊 Chapter 3 - New Vocabulary</div>
        <div class="sec-body">
            ${playBar('ch3Vocab')}
            <div class="info-box"><div class="info-title">New Vocabulary</div><div class="vocab">${makePills(ch3Vocab, 'ch3Vocab')}</div></div>
        </div>
    </div>`;

    // 2. Phrases, Expressions, Idioms & Prepositions
    html += `<div class="section-block" id="ch3Phrases">
        <div class="sec-title">💬 Chapter 3 - Phrases, Expressions, Idioms & Prepositions</div>
        <div class="sec-body">
            ${playBar('ch3Phrases')}
            <div class="rules-grid">${ch3Phrases.map((e,i) => makeRuleItem('💡', 'ch3Phrases', i, e[0], e[1], e[0])).join('')}</div>
        </div>
    </div>`;

    // 3. Chapter Text
    html += `<div class="section-block" id="ch3Story">
        <div class="sec-title">📖 Chapter 3 - Chapter Text</div>
        <div class="sec-body">
            ${playBar('ch3Story')}
            ${makeStorySection('The Count of Monte Cristo - Chapter 3', ch3Story)}
        </div>
    </div>`;

    container.innerHTML = html;
}

// ===================== نظام الصوت =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    populateVoiceSelect();
}
function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    const allVoices = voices;
    if (!allVoices.length) return;
    const normalizeLang = (lang) => lang.replace('_', '-');
    const isLangMatch = (voiceLang, targetPrefix) => normalizeLang(voiceLang) === targetPrefix || normalizeLang(voiceLang).startsWith(targetPrefix + '-');
    const usVoice = allVoices.find(v => isLangMatch(v.lang, 'en-US'));
    const gbVoice = allVoices.find(v => isLangMatch(v.lang, 'en-GB'));
    const options = [];
    if (usVoice) options.push({ label: '🇺🇸 American', uri: usVoice.voiceURI });
    if (gbVoice) options.push({ label: '🇬🇧 British', uri: gbVoice.voiceURI });
    if (!options.length) {
        note.textContent = '⚠️ No US/UK voice found.';
        const anyEn = allVoices.filter(v => v.lang.startsWith('en')).slice(0,2);
        anyEn.forEach(v => options.push({ label: v.name + ' ('+v.lang+')', uri: v.voiceURI }));
    } else {
        note.textContent = '';
    }
    const savedURI = localStorage.getItem('voiceURI');
    vs.innerHTML = options.map(o => `<option value="${o.uri}">${o.label}</option>`).join('');
    if (savedURI && options.some(o => o.uri === savedURI)) vs.value = savedURI;
}
document.getElementById('voiceSelect').addEventListener('change', function() {
    localStorage.setItem('voiceURI', this.value);
});

function getSelectedVoice() {
    const uri = localStorage.getItem('voiceURI');
    return voices.find(v => v.voiceURI === uri) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}
function showFab(show) { if (show) fabPause.classList.add('show'); else fabPause.classList.remove('show'); }
function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) fabPause.innerHTML = '⏸️';
    else if (window.speechSynthesis.paused) fabPause.innerHTML = '▶️';
    else fabPause.innerHTML = '⏯️';
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights(); showFab(false); return;
    }
    const item = window._q[window._qi];
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }
    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    if (voice) u.voice = voice;

    u.onstart = () => { showFab(true); updateFabIcon(); };
    u.onend = function() { window._qi++; playQueue(); };
    u.onerror = function(e) { console.warn('Speech error', e); window._qi++; playQueue(); };
    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => { const trimmed = p.trim(); if (trimmed) window._q.push({id: id, text: trimmed}); });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    if(!sec) return;
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause(); updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume(); updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() { pauseAll(); }

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
setTimeout(loadVoices, 300);
setTimeout(loadVoices, 1000);
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
