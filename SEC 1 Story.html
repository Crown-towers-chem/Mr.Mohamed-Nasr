function cleanForSpeech(text) {
    let result = text;
    result = result.replace(/\([^)]*\)/g, ' '); 
    result = result.replace(/[→]/g, ' ');      
    result = result.replace(/\s+/g, ' ').trim(); 
    return result;
}

function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

        ["lean back", "يتكأ"], ["dare to", "يتجرأ على"], ["fishing gear", "معدات الصيد"],

    const c1Text = [
        {en: "Santiago was an old fisherman, and the sea was his companion. His skin had grown dark and leathery from years beneath the burning sun.", ar: "كان سانتياغو صياداً عجوزاً، وكان البحر رفيقه. أصبح جلده داكناً ومصبوغاً من سنوات تحت الشمس الحارقة."},
        {en: "His hands were rough, cut, and scarred from pulling heavy fishing lines day after day. Yet, when people looked into his eyes, they did not see weakness. His eyes were as clear and bright as the sea itself.", ar: "كانت يداه خشنتين ومقطوعتين ومليئتين بالندوب من سحب خيوط الصيد الثقيلة يوماً بعد يوم. ومع ذلك، عندما نظر الناس في عينيه، لم يروا ضعفاً. كانت عيناه صافيتين ومشرقتين مثل البحر نفسه."},
        {en: "For eighty-four long days, Santiago had gone out into the Gulf Stream and returned empty-handed. Not a single fish had been caught.", ar: "لمدة أربعة وثمانين يوماً طويلة، كان سانتياغو يخرج إلى تيار الخليج ويعود خالي اليدين. لم يتم صيد سمكة واحدة."},
        {en: "In his small Cuban village, whispers began to spread. The younger fishermen, who still had luck, laughed at him quietly. They called him salao—the worst kind of unlucky. Yet Santiago carried himself with dignity.", ar: "في قريته الكوبية الصغيرة، بدأت الهمسات تنتشر. كان الصيادون الأصغر سناً، الذين لا يزال لديهم الحظ، يضحكون عليه بهدوء. لقد أطلقوا عليه اسم سالاو - وهو أسوأ أنواع سوء الحظ. ومع ذلك، كان سانتياغو يحمل نفسه بكرامة."},
        {en: "He walked proudly with his fishing gear over his shoulder, his back straight, as if luck were something that could never truly defeat a man.", ar: "كان يمشي بفخر ومعدات الصيد على كتفه، وظهره مستقيم، وكأن الحظ شيء لا يمكن أن يهزم رجلاً حقاً."},
        {en: "Among all the people of the village, only one remained loyal to him: a boy named Manolin. The boy had fished with Santiago since he was just five years old. Now he was twelve, strong and full of admiration for the old man.", ar: "من بين جميع سكان القرية، بقي واحد فقط مخلصاً له: صبي يدعى مانولين. كان الصبي يصطاد مع سانتياغو منذ أن كان عمره خمس سنوات فقط. الآن كان في الثانية عشرة من عمره، قوياً ومليئاً بالإعجاب بالرجل العجوز."},
        {en: "He loved Santiago like a grandfather. For forty days, Manolin had fished with him, even when there was no catch. But finally, at his parents' order, he had joined another boat—a luckier boat that brought back fish.", ar: "لقد أحب سانتياغو مثل الجد. لمدة أربعين يوماً، كان مانولين يصطاد معه، حتى عندما لم يكن هناك صيد. لكن أخيراً، وبناءً على أوامر والديه، انضم إلى قارب آخر - قارب أكثر حظاً يعيد السمك."},
        {en: "Still, every evening, when the other fishermen returned with their catch, Manolin would go to Santiago's small skiff. He would help the old man carry his nets, his gaff, and his harpoon. He would fold the patched sail. He would carry the old man's heavy lines, carefully coiled, and walk beside him.", ar: "ومع ذلك، كل مساء، عندما يعود الصيادون الآخرون بصيدهم، كان مانولين يذهب إلى قارب سانتياغو الصغير. كان يساعد الرجل العجوز في حمل شباكه، وخطافه، ورمحه. كان يطوي الشراع المليء بالرقع. وكان يحمل خيوط الرجل العجوز الثقيلة، الملفوفة بعناية، ويمشي بجانبه."}

        {en: "He put on his old trousers, picked up his coil of lines, and stepped outside his small hut. The boy, Manolin, was already waiting for him. He carried food wrapped in paper—a gift for Santiago.", ar: "ارتدى بنطاله القديم، والتقط لفافة خيوطه، وخرج من كوخه الصغير. كان الصبي، مانولين، ينتظره بالفعل. كان يحمل طعاماً ملفوفاً في ورق - هدية لسانتياغو."},
        {en: "'Here, old man. Some black beans, rice, and a little coffee,' he said proudly. Santiago accepted it gratefully. 'You are good to me, boy. I will need my strength today.'", ar: "'هنا يا رجل عجوز. بعض الفاصوليا السوداء والأرز والقليل من القهوة،' قال بفخر. قبلها سانتياغو بامتنان. 'أنت طيب معي يا فتى. سأحتاج قوتي اليوم.'"},

        {en: "With all the strength left in him, Santiago drove the harpoon down into the shark's head. The iron stuck deep, and the shark thrashed violently, turning the sea red. Finally, it sank, dead, into the depths.", ar: "بكل ما تبقى له من قوة، دفع سانتياغو الرمح في رأس القرش. اخترق الحديد بعمق، وتلوى القرش بعنف، محولاً البحر إلى اللون الأحمر. أخيراً، غرق ميتاً في الأعماق."},
        {en: "But the victory was bitter. The marlin had lost a great piece of flesh, and blood flowed freely from its wound. Santiago looked at his catch with sorrow. 'They will come now, one after another,' he said.", ar: "لكن النصر كان مراً. فقد المارلين قطعة كبيرة من لحمه، وكان الدم يتدفق بحرية من جرحه. نظر سانتياغو إلى صيده بحزن. 'سيأتون الآن، واحداً تلو الآخر،' قال."},
        {en: "He was right. Before long, more shadows appeared. A pair of galanos—shovel-nosed sharks—rose from the deep. They were slower but insistent. They bit at the marlin, tearing away its flesh. Santiago fought with his harpoon until it broke off in a shark's body.", ar: "كان محقاً. قبل وقت طويل، ظهرت المزيد من الظلال. ظهر زوج من غالانوس - أسماك قرش تشبه أنفها المجرفة - من الأعماق. كانت أبطأ لكنها مصممة. عضت المارلين، وانتزعت لحمه. قاتل سانتياغو برمحه حتى انكسر داخل جسم قرش."},
        {en: "Now, he tied his knife to an oar and used it as a spear. He stabbed and slashed, killing one shark and driving the other away. But each battle cost him strength, and the marlin's body grew smaller, its beauty ruined.", ar: "الآن، ربط سكينه بمجذاف واستخدمه كرمح. طعن وشق، قاتلاً سمكة قرش وطارداً الأخرى بعيداً. لكن كل معركة كلفته قوة، وجسم المارلين أصبح أصغر، وأفسد جماله."},
        {en: "As the hours passed, more sharks came. The smell of blood had spread far through the sea. Santiago fought them all, his arms burning, his vision blurring. He killed several but knew he could not stop them forever.", ar: "مع مرور الساعات، جاءت المزيد من أسماك القرش. انتشرت رائحة الدم في البحر. حاربهم سانتياغو جميعاً، وذراعاه تحترقان، ورؤيته غير واضحة. قتل العديد منهم لكنه علم أنه لا يستطيع إيقافهم للأبد."},
        {en: "By afternoon, the marlin was only half a fish. Its head and backbone remained, but much of its flesh was gone. Santiago leaned against the mast, breathing heavily. 'I was beaten,' he whispered, 'but only by sharks, not by the fish.'", ar: "بحلول فترة ما بعد الظهر، كان المارلين نصف سمكة فقط. بقي رأسه وعموده الفقري، لكن الكثير من لحمه اختفى. استند سانتياغو إلى الصاري، يتنفس بصعوبة. 'لقد هُزمت،' همس، 'لكن فقط بواسطة أسماك القرش، وليس بواسطة السمكة.'"}
    ];

    return [
        { id: 'ch1', name: 'Chapter 1', vocab: c1Vocab, phrases: c1Phrases, text: c1Text },
        { id: 'ch2', name: 'Chapter 2', vocab: c2Vocab, phrases: c2Phrases, text: c2Text },
        { id: 'ch3', name: 'Chapter 3', vocab: c3Vocab, phrases: c3Phrases, text: c3Text },
        { id: 'ch4', name: 'Chapter 4', vocab: c4Vocab, phrases: c4Phrases, text: c4Text },
        { id: 'ch5', name: 'Chapter 5', vocab: c5Vocab, phrases: c5Phrases, text: c5Text },
        { id: 'ch6', name: 'Chapter 6', vocab: c6Vocab, phrases: c6Phrases, text: c6Text }
    ];
}

// ===================== بناء الواجهة (Tabs Generator) =====================
function buildAllSections() {
    const container = document.getElementById('mainContainer');
    const chapters = makeChapterData();

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function playBar(sectionId) {
        return `<div class="sec-play-bar">
            <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
            <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
            <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
        </div>`;
    }

    function makeStorySection(title, storyData) {
        return `<div class="story-card">
            <div style="font-weight:bold;color:var(--A);margin-bottom:12px;">${title}</div>
            ${storyData.map((s,i) => {
                const id = `secStory_${title.replace(/\s/g,'')}_${i}`;
                const wordHtml = makeWordSpans(s.en);
                return `<div class="sentence" id="${id}" data-speak="${s.en}" onclick="playOne('${id}')">${wordHtml}</div>`;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    let allTabsHTML = '';
    chapters.forEach((ch, idx) => {
        const activeClass = idx === 0 ? 'active' : '';
        const secId = ch.id;

        let contentHTML = '';

        // 1. Vocabulary
        if (ch.vocab && ch.vocab.length > 0) {
            contentHTML += `<div class="section-block" id="${secId}-vocab">
                <div class="sec-title">📚 Chapter ${idx+1} Vocabulary</div>
                <div class="sec-body">
                    ${playBar(`${secId}-vocab`)}
                    <div class="info-box"><div class="info-title">Vocabulary</div><div class="vocab">${makePills(ch.vocab, `${secId}-vocab`)}</div></div>
                </div>
            </div>`;
        }

        // 2. Phrases
        if (ch.phrases && ch.phrases.length > 0) {
            contentHTML += `<div class="section-block" id="${secId}-phrases">
                <div class="sec-title">💬 Expressions & Phrases</div>
                <div class="sec-body">
                    ${playBar(`${secId}-phrases`)}
                    <div class="rules-grid">${ch.phrases.map((e,i) => makeRuleItem('💡', `${secId}-phrases`, i, e[0], e[1], e[0])).join('')}</div>
                </div>
            </div>`;
        }

        // 3. Reading Text
        if (ch.text && ch.text.length > 0) {
            contentHTML += `<div class="section-block" id="${secId}-text">
                <div class="sec-title">📖 Reading Text (Chapter ${idx+1})</div>
                <div class="sec-body">
                    ${playBar(`${secId}-text`)}
                    ${makeStorySection(`Story - ${ch.name}`, ch.text)}
                </div>
            </div>`;
        }

        allTabsHTML += `<div class="tab-content ${activeClass}" id="${secId}">${contentHTML}</div>`;
    });

    container.innerHTML = allTabsHTML;
}

// ===================== نظام التاب =====================
document.getElementById('tabsNav').addEventListener('click', function(e) {
    if(e.target.classList.contains('tab-btn')) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');

        const tabId = e.target.dataset.tab;
        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');

        // Stop audio when switching tabs to prevent confusion
        stopAll();
    }
});

// ===================== نظام الصوت =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    populateVoiceSelect();
}
function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    const allVoices = voices;
    if (!allVoices.length) return;
    const normalizeLang = (lang) => lang.replace('_', '-');
    const isLangMatch = (voiceLang, targetPrefix) => normalizeLang(voiceLang) === targetPrefix || normalizeLang(voiceLang).startsWith(targetPrefix + '-');
    const usVoice = allVoices.find(v => isLangMatch(v.lang, 'en-US'));
    const gbVoice = allVoices.find(v => isLangMatch(v.lang, 'en-GB'));
    const options = [];
    if (usVoice) options.push({ label: '🇺🇸 American', uri: usVoice.voiceURI });
    if (gbVoice) options.push({ label: '🇬🇧 British', uri: gbVoice.voiceURI });
    if (!options.length) {
        note.textContent = '⚠️ No US/UK voice found.';
        const anyEn = allVoices.filter(v => v.lang.startsWith('en')).slice(0,2);
        anyEn.forEach(v => options.push({ label: v.name + ' ('+v.lang+')', uri: v.voiceURI }));
    } else {
        note.textContent = '';
    }
    const savedURI = localStorage.getItem('voiceURI');
    vs.innerHTML = options.map(o => `<option value="${o.uri}">${o.label}</option>`).join('');
    if (savedURI && options.some(o => o.uri === savedURI)) vs.value = savedURI;
}
document.getElementById('voiceSelect').addEventListener('change', function() {
    localStorage.setItem('voiceURI', this.value);
});

function getSelectedVoice() {
    const uri = localStorage.getItem('voiceURI');
    return voices.find(v => v.voiceURI === uri) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}
function showFab(show) { if (show) fabPause.classList.add('show'); else fabPause.classList.remove('show'); }
function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) fabPause.innerHTML = '⏸️';
    else if (window.speechSynthesis.paused) fabPause.innerHTML = '▶️';
    else fabPause.innerHTML = '⏯️';
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights(); showFab(false); return;
    }
    const item = window._q[window._qi];
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }
    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    if (voice) u.voice = voice;

    u.onstart = () => { showFab(true); updateFabIcon(); };
    u.onend = function() { window._qi++; playQueue(); };
    u.onerror = function(e) { console.warn('Speech error', e); window._qi++; playQueue(); };
    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => { const trimmed = p.trim(); if (trimmed) window._q.push({id: id, text: trimmed}); });
}

function getActiveContainer() {
    return document.querySelector('.tab-content.active');
}

function playSection(secId) {
    stopAll();
    const activeTab = getActiveContainer();
    if(!activeTab) return;
    const sec = activeTab.querySelector(`#${secId}`);
    if(!sec) return;
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const activeTab = getActiveContainer();
    if(!activeTab) return;
    const els = [...activeTab.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause(); updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume(); updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() { pauseAll(); }

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
setTimeout(loadVoices, 300);
setTimeout(loadVoices, 1000);
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
